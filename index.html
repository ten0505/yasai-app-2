<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>新 家庭菜園管理 v20261105</title>
<style>
:root {
  --primary:#3d7a3d; --primary-d:#2a5a2a; --primary-l:#a8d4a8;
  --accent:#e8952a; --bg:#f0f4ed; --surface:#fff; --border:#cce0cc;
  --text:#1a2e1a; --muted:#5a7a5a; --sidebar:200px; --hdr:52px; --r:8px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Meiryo','Yu Gothic',sans-serif;background:var(--bg);color:var(--text);font-size:13px}
button{cursor:pointer;border:none;background:none;font-family:inherit;font-size:inherit}
input,select,textarea{font-family:inherit;font-size:inherit;border:1px solid var(--border);border-radius:4px;padding:5px 8px;width:100%;background:#fff}
textarea{resize:vertical}
label{display:block;font-size:12px;color:var(--muted);margin-bottom:2px;margin-top:8px}
h2{font-size:15px;color:var(--primary-d)}
h3{font-size:13px;color:var(--primary-d)}

/* Layout */
#hdr{position:fixed;top:0;left:0;right:0;height:var(--hdr);background:var(--primary-d);
  color:#fff;display:flex;align-items:center;gap:8px;padding:0 12px;z-index:100;box-shadow:0 2px 6px rgba(0,0,0,.3)}
#hdr h1{font-size:15px;font-weight:bold;flex:0 0 auto}
.nav-tabs{display:flex;gap:4px;flex:1}
.nav-tab{padding:5px 10px;border-radius:20px;color:rgba(255,255,255,.75);font-size:12px;transition:.2s}
.nav-tab:hover{background:rgba(255,255,255,.15);color:#fff}
.nav-tab.active{background:#fff;color:var(--primary-d);font-weight:bold}
#toggle-sb{background:none;border:none;color:#fff;font-size:18px;width:32px;height:32px}
#sync-badge{font-size:10px;padding:2px 8px;border-radius:10px;background:rgba(255,255,255,.2);flex:0 0 auto}
#sync-badge.ok{background:#16a34a}
#sync-badge.error{background:#dc2626}
#sync-badge.connecting{background:#ca8a04}

.layout{display:flex;margin-top:var(--hdr);height:calc(100vh - var(--hdr))}
#sidebar{width:var(--sidebar);flex:0 0 auto;background:#fff;border-right:1px solid var(--border);
  display:flex;flex-direction:column;overflow:hidden;transition:width .2s}
#sidebar.collapsed{width:0}
.sb-head{padding:10px 10px 6px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.sb-head span{font-weight:bold;font-size:12px;color:var(--muted)}
.btn-sm{padding:3px 8px;background:var(--primary);color:#fff;border-radius:12px;font-size:11px}
.btn-sm:hover{background:var(--primary-d)}
#veg-list{flex:1;overflow-y:auto;padding:4px 0}
.veg-item{display:flex;align-items:center;gap:8px;padding:7px 10px;cursor:pointer;border-left:3px solid transparent;transition:.15s}
.veg-item:hover{background:var(--bg)}
.veg-item.active{background:#e8f5e8;border-left-color:var(--primary)}
.veg-dot{width:10px;height:10px;border-radius:50%;flex:0 0 auto}
.veg-name{font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

#main{flex:1;overflow:auto}

/* Cards */
.card{background:var(--surface);border-radius:var(--r);border:1px solid var(--border);padding:14px;margin:10px}
.badge{display:inline-block;padding:1px 7px;border-radius:10px;font-size:11px;font-weight:bold}
.badge-plan{background:#dbeafe;color:#1d4ed8}
.badge-actual{background:#dcfce7;color:#15803d}
.badge-harvest{background:#fee2e2;color:#dc2626}

.btn{padding:7px 16px;border-radius:6px;font-size:13px;font-weight:bold;transition:.2s}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{background:var(--primary-d)}
.btn-danger{background:#dc2626;color:#fff}
.btn-danger:hover{background:#b91c1c}
.btn-outline{background:none;border:1px solid var(--border);color:var(--muted)}
.btn-outline:hover{border-color:var(--primary);color:var(--primary)}

/* Timeline */
#timeline-wrap{padding:10px}
.tl-scroll{overflow-x:auto}
.tl-table{border-collapse:collapse;white-space:nowrap}
.tl-table th,.tl-table td{border:1px solid var(--border);padding:0}
.tl-veg-col{position:sticky;left:0;background:#fff;z-index:10;min-width:92px;max-width:92px;padding:4px 6px;
  font-size:11px;font-weight:bold;vertical-align:middle;border-right:2px solid var(--primary-l)}
.tl-head-veg{background:var(--primary-d);color:#fff;text-align:center;padding:4px 6px;font-size:11px;
  position:sticky;left:0;z-index:20}
.tl-date-head{min-width:40px;max-width:40px;text-align:center;padding:2px;font-size:10px;
  background:var(--primary-d);color:rgba(255,255,255,.8);vertical-align:middle;cursor:pointer}
.tl-date-head.today{background:#e8952a;color:#fff;font-weight:bold}
.tl-date-head.weekend{background:#2a4a6a}
.tl-cell{min-width:40px;max-width:40px;height:28px;vertical-align:middle;text-align:center;
  cursor:pointer;transition:.15s;position:relative}
.tl-cell:hover{background:#e8f5e8 !important}
.tl-cell.today{background:#fffbeb !important}
.tl-cell.has-data{background:#f0faf0}
.tl-dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin:0 1px}
.tl-dot.plan{background:#fff;border:2px solid #2563eb;width:8px;height:8px}
.tl-veg-btn{display:flex;align-items:center;gap:4px;width:100%;text-align:left}

/* Popup */
#popup{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.4);z-index:200;
  align-items:center;justify-content:center;display:none}
#popup.show{display:flex}
.popup-box{background:#fff;border-radius:var(--r);max-width:440px;width:94%;max-height:80vh;
  overflow-y:auto;box-shadow:0 8px 32px rgba(0,0,0,.25)}
.popup-hdr{padding:12px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;
  position:sticky;top:0;background:#fff;z-index:1}
.popup-body{padding:14px}
.popup-entry{padding:8px 0;border-bottom:1px solid var(--border)}
.popup-entry:last-child{border-bottom:none}

/* Lightbox */
#lightbox{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:300;display:none;
  align-items:center;justify-content:center;flex-direction:column;gap:8px}
#lightbox.show{display:flex}
#lightbox img{max-width:95vw;max-height:85vh;border-radius:6px}
#lightbox .lb-nav{color:#fff;font-size:13px}

/* Detail */
#detail-wrap{padding:10px}
.veg-header{background:var(--surface);border-radius:var(--r);border:1px solid var(--border);
  padding:14px;margin-bottom:10px;display:flex;align-items:center;gap:12px}
.veg-icon{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:20px;flex:0 0 auto}
.tab-bar{display:flex;gap:0;border-bottom:2px solid var(--border);margin-bottom:10px}
.tab-btn{padding:8px 16px;font-size:12px;font-weight:bold;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-2px;transition:.15s}
.tab-btn.active{color:var(--primary);border-bottom-color:var(--primary)}
.tab-btn:hover{color:var(--primary)}
.field-group{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:6px}
.field-item label{font-size:11px;color:var(--muted);margin:0}
.field-item .val{font-size:13px;color:var(--text);min-height:18px;padding:2px 0;word-break:break-all;white-space:pre-wrap}
.field-item.full{grid-column:1/-1}
.section-card{background:var(--surface);border-radius:var(--r);border:1px solid var(--border);padding:12px;margin-bottom:8px}
.section-title{font-size:12px;font-weight:bold;color:var(--primary-d);margin-bottom:8px;
  padding-bottom:4px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.temp-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:8px}
.temp-box{background:#f0f8f0;border:1px solid var(--primary-l);border-radius:6px;padding:8px;text-align:center}
.temp-box .t-label{font-size:10px;color:var(--muted)}
.temp-box .t-val{font-size:13px;font-weight:bold;color:var(--primary-d);margin-top:2px;white-space:pre-wrap}

/* Schedule list */
.sched-item{background:var(--surface);border-radius:var(--r);border:1px solid var(--border);
  padding:10px 12px;margin-bottom:6px;display:flex;gap:10px}
.sched-item .left{flex:0 0 auto;text-align:center;min-width:56px}
.sched-item .date{font-size:13px;font-weight:bold;color:var(--primary-d)}
.sched-item .time{font-size:10px;color:var(--muted)}
.sched-item .right{flex:1;min-width:0}
.sched-item .act{font-weight:bold;font-size:13px;margin-bottom:3px}
.sched-item .memo{font-size:11px;color:var(--muted)}
.photo-thumbs{display:flex;flex-wrap:wrap;gap:3px;margin-top:4px}
.photo-thumb{width:56px;height:56px;object-fit:cover;border-radius:4px;cursor:pointer}

/* Harvest table */
.harvest-table{width:100%;border-collapse:collapse;font-size:12px}
.harvest-table th{background:var(--primary-d);color:#fff;padding:6px 8px;text-align:left}
.harvest-table td{padding:5px 8px;border-bottom:1px solid var(--border)}
.harvest-table tr:hover td{background:var(--bg)}
.harvest-total{font-weight:bold;background:#e8f5e8 !important}

/* Entry form */
#entry-wrap{padding:10px;max-width:760px}
.entry-section{background:var(--surface);border-radius:var(--r);border:1px solid var(--border);padding:12px;margin-bottom:10px}
.entry-section .sec-title{font-size:13px;font-weight:bold;color:#fff;background:var(--primary);
  margin:-12px -12px 10px;padding:7px 12px;border-radius:var(--r) var(--r) 0 0;display:flex;justify-content:space-between;align-items:center}
.form-row-2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form-row-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.work-row{border:1px solid var(--border);border-radius:6px;padding:8px;margin-bottom:8px;background:#fafdf9}
.work-row-head{display:flex;gap:6px;align-items:flex-end}
.work-row-head .fi{flex:1}
.row-del{color:#dc2626;font-size:16px;padding:4px 8px;flex:0 0 auto}
.act-check-grid{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.act-check-label{display:inline-flex;align-items:center;padding:5px 11px;border:1.5px solid var(--border);
  border-radius:16px;cursor:pointer;font-size:12px;user-select:none;transition:.15s;background:#fff}
.act-check-label:hover{border-color:var(--primary);background:#f0f8f0}
.act-check-label.checked{background:var(--primary);color:#fff;border-color:var(--primary-d)}
.act-check-label input[type=checkbox]{display:none}
.chip-mini{gap:4px}
.chip-mini .act-check-label{padding:3px 9px;font-size:11px;border-radius:13px}
.form-actions{display:flex;gap:8px;margin-top:14px;padding-top:10px;border-top:1px solid var(--border)}
.photo-item{position:relative;width:72px;height:72px;flex:0 0 auto}
.photo-item img{width:72px;height:72px;object-fit:cover;border-radius:4px;display:block}
.photo-del{position:absolute;top:-5px;right:-5px;background:#dc2626;color:#fff;border-radius:50%;
  width:18px;height:18px;font-size:11px;display:flex;align-items:center;justify-content:center;
  cursor:pointer;border:none;line-height:1;padding:0}
.photo-add-btn{font-size:11px;padding:4px 10px;border:1px dashed var(--primary);color:var(--primary);border-radius:12px;margin-top:4px}
.wx-btn{background:#2563eb;color:#fff;border-radius:6px;padding:6px 12px;font-size:12px;font-weight:bold}
.wx-btn:disabled{opacity:.5;cursor:default}
.day-list-item{display:flex;justify-content:space-between;align-items:center;padding:7px 4px;border-bottom:1px solid var(--border);font-size:12px}
.day-list-item:hover{background:var(--bg)}

/* Variety tags */
.variety-tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.vtag{padding:2px 8px;background:var(--primary-l);color:var(--primary-d);border-radius:12px;font-size:11px}

#settings-wrap,#form-wrap{padding:10px;max-width:600px}

#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#1a2e1a;color:#fff;
  padding:9px 20px;border-radius:20px;font-size:12px;z-index:400;opacity:0;transition:opacity .3s;pointer-events:none}
#toast.show{opacity:.92}

::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--primary-l);border-radius:3px}

@media (max-width:700px){
  :root{--sidebar:160px}
  #hdr h1{display:none}
  .nav-tab{padding:5px 8px;font-size:11px}
  .form-row-3{grid-template-columns:1fr}
  .field-group{grid-template-columns:1fr}
  .temp-grid{grid-template-columns:1fr}
}
</style>
</head>

  <button id="toggle-sb">☰</button>
  <h1>🥬 新 家庭菜園管理</h1>

    <button class="nav-tab" data-v="layout">🗺 畑レイアウト</button>

<div class="layout">

</div>
<div id="popup"><div class="popup-box" id="popup-box"></div></div>
<div id="lightbox"><img id="lb-img" src="" alt=""><div class="lb-nav" id="lb-nav"></div></div>
<div id="toast"></div>

// ===================== 天気取得（Open-Meteo / 千葉県印西市戸神） =====================
const DEFAULT_LOC={name:'千葉県印西市戸神',lat:35.788,lon:140.120};
const WMO_MAP={0:'快晴',1:'晴',2:'晴時々曇',3:'曇',45:'霧',48:'霧',51:'霧雨',53:'霧雨',55:'霧雨',
 56:'霧雨',57:'霧雨',61:'小雨',63:'雨',65:'大雨',66:'氷雨',67:'氷雨',71:'小雪',73:'雪',75:'大雪',77:'雪',
 80:'にわか雨',81:'にわか雨',82:'激しい雨',85:'にわか雪',86:'にわか雪',95:'雷雨',96:'雷雨',99:'雷雨'};
const DIR16=['北','北北東','北東','東北東','東','東南東','南東','南南東','南','南南西','南西','西南西','西','西北西','北西','北北西'];
function getLoc(){
  try{const s=JSON.parse(localStorage.getItem('yasai2_loc'));if(s&&s.lat&&s.lon)return s;}catch(e){}
  return DEFAULT_LOC;
}
async function fetchWeatherFor(dateStr,timeFrom,timeTo){
  const loc=getLoc();
  const target=new Date(dateStr+'T00:00:00');
  const today=new Date();today.setHours(0,0,0,0);
  const diffDays=Math.round((today-target)/86400000);
  const base=diffDays>5?'https://archive-api.open-meteo.com/v1/archive':'https://api.open-meteo.com/v1/forecast';
  const url=`${base}?latitude=${loc.lat}&longitude=${loc.lon}&start_date=${dateStr}&end_date=${dateStr}`+
    `&hourly=temperature_2m,weather_code,wind_speed_10m,wind_direction_10m&wind_speed_unit=ms&timezone=Asia%2FTokyo`;
  const res=await fetch(url);
  if(!res.ok)throw new Error('HTTP '+res.status);
  const j=await res.json();
  const H=j.hourly;
  if(!H||!H.time||!H.time.length)throw new Error('データなし');
  let h1=9,h2=12;
  if(timeFrom){h1=parseInt(timeFrom.split(':')[0],10);h2=h1+1;}
  if(timeTo){h2=Math.max(h1+1,parseInt(timeTo.split(':')[0],10)+(timeTo.split(':')[1]>'00'?1:0));}
  if(h2>23)h2=23; if(h1>23)h1=23;
  const idx=[];for(let h=h1;h<=h2;h++){const i=H.time.findIndex(t=>t.endsWith('T'+String(h).padStart(2,'0')+':00'));if(i>=0&&H.temperature_2m[i]!=null)idx.push(i);}
  if(!idx.length)throw new Error('対象時間のデータなし(未来すぎる可能性)');
  const avg=a=>a.reduce((s,x)=>s+x,0)/a.length;
  const temp=Math.round(avg(idx.map(i=>H.temperature_2m[i])));
  const wspd=Math.round(avg(idx.map(i=>H.wind_speed_10m[i])));
  // 最頻の天気コード（同数なら悪い方）
  const codes=idx.map(i=>H.weather_code[i]);
  const freq={};codes.forEach(c=>freq[c]=(freq[c]||0)+1);
  let code=codes[0],best=0;
  Object.keys(freq).forEach(c=>{const n=freq[c];if(n>best||(n===best&&+c>+code)){best=n;code=+c;}});
  // 風向: ベクトル平均
  let sx=0,sy=0;idx.forEach(i=>{const r=H.wind_direction_10m[i]*Math.PI/180;sx+=Math.sin(r);sy+=Math.cos(r);});
  let deg=Math.atan2(sx,sy)*180/Math.PI;if(deg<0)deg+=360;
  const dir=DIR16[Math.round(deg/22.5)%16];
  return {weather:WMO_MAP[code]||('コード'+code),wind:`${dir}${wspd}m`,temp:`${temp}℃`};
}

// ===================== 画像圧縮（長辺800px / JPEG65%・前回ルール継承） =====================
function _compressImage(file,callback){
  const MAX_PX=800,QUALITY=0.65;
  const blobUrl=URL.createObjectURL(file);
  const img=new Image();
  img.onload=()=>{
    URL.revokeObjectURL(blobUrl);
    let w=img.width,h=img.height;
    if(w>MAX_PX||h>MAX_PX){ if(w>=h){h=Math.round(h*MAX_PX/w);w=MAX_PX;} else {w=Math.round(w*MAX_PX/h);h=MAX_PX;} }
    const canvas=document.createElement('canvas');
    canvas.width=w;canvas.height=h;
    canvas.getContext('2d').drawImage(img,0,0,w,h);
    const result=canvas.toDataURL('image/jpeg',QUALITY);
    canvas.width=0;canvas.height=0;
    callback(result);
  };
  img.onerror=()=>{
    URL.revokeObjectURL(blobUrl);
    const reader=new FileReader();
    reader.onload=ev=>callback(ev.target.result);
    reader.onerror=()=>callback(null);
    reader.readAsDataURL(file);
  };
  img.src=blobUrl;
}

function _normalizeVeg(v){
  if(!Array.isArray(v.varieties))v.varieties=[];
  if(!v.mgmt||typeof v.mgmt!=='object')v.mgmt={};
  MGMT_FIELDS.forEach(([k])=>{if(v.mgmt[k]==null)v.mgmt[k]='';});
  if(!v.tax||typeof v.tax!=='object')v.tax={};
  v.tax.family=v.tax.family??v.family??'';
  v.tax.genus=v.tax.genus??'';
  delete v.family;
  if(!v.traits||typeof v.traits!=='object')v.traits={};
  TRAIT_FIELDS.forEach(([k])=>{if(v.traits[k]==null)v.traits[k]='';});
  if(v.emoji==null)v.emoji='🌱';
  if(v.color==null)v.color='#3d7a3d';
  // 旧データ救済: シードに同じidがあれば、空欄の分類・特長・管理メモをシード値で補完（1回のみ）
  const seed=v.seedv>=2?null:VEG_SEED.find(s=>s.id===v.id);
  if(seed){
    v.seedv=2;
    if(!v.tax.family&&seed.tax)v.tax.family=seed.tax.family||'';
    if(!v.tax.genus&&seed.tax)v.tax.genus=seed.tax.genus||'';
    if(seed.traits)TRAIT_FIELDS.forEach(([k])=>{if(!v.traits[k])v.traits[k]=seed.traits[k]||'';});
    if(seed.mgmt)MGMT_FIELDS.forEach(([k])=>{if(!v.mgmt[k])v.mgmt[k]=seed.mgmt[k]||'';});
  }
  return v;
}
function _normalizeDay(d){
  if(!Array.isArray(d.fieldActs))d.fieldActs=[];
  if(!Array.isArray(d.fieldPhotos))d.fieldPhotos=[];
  if(!Array.isArray(d.works))d.works=[];
  d.works.forEach(w=>{
    if(!Array.isArray(w.photos))w.photos=w.photo?[w.photo]:[];
    // 旧形式(単一選択 vid/act)→新形式(複数選択 vids/acts)へ変換
    if(!Array.isArray(w.vids))w.vids=w.vid?[w.vid]:[];
    if(!Array.isArray(w.acts))w.acts=w.act?[w.act]:[];
    delete w.vid;delete w.act;
  });
  return d;
}
// シード作物の追加マイグレーション（アプリ更新で作物が増えた時、既存データにも1回だけ追加する）
const SEED_VER=2; // v2: 茎ブロッコリー・芽キャベツ追加
function _migrateSeedVegs(){
  if((D.seedVer||1)>=SEED_VER)return;
  VEG_SEED.forEach(s=>{
    if(!D.vegetables.find(v=>v.id===s.id))D.vegetables.push(_normalizeVeg(JSON.parse(JSON.stringify(s))));
  });
  D.seedVer=SEED_VER;
}
function _dataWithoutPhotos(){
  return {
    seedVer:D.seedVer||1,
    vegetables:D.vegetables,
    days:D.days.map(dd=>{
      const c=Object.assign({},dd,{works:(dd.works||[]).map(w=>{const cw=Object.assign({},w);delete cw.photos;delete cw.photo;return cw;})});
      delete c.fieldPhotos;
      return c;
    }),
    plans:D.plans,
    harvests:D.harvests
  };
}
function _saveLocal(){
  const hasCloud=!!localStorage.getItem('yasai2_fb');
  try{
    localStorage.setItem('yasai2_v1',JSON.stringify(hasCloud?_dataWithoutPhotos():D));
  }catch(e){
    try{localStorage.setItem('yasai2_v1',JSON.stringify(_dataWithoutPhotos()));}catch(e2){console.warn('local save failed',e2);}
  }
}
function saveData(){_saveLocal();saveToCloud();}
function loadData(){
  const saved=localStorage.getItem('yasai2_v1');
  if(saved){
    try{
      D=JSON.parse(saved);
      if(!Array.isArray(D.vegetables))D.vegetables=[];
      if(!Array.isArray(D.days))D.days=[];
      if(!Array.isArray(D.plans))D.plans=[];
      if(!Array.isArray(D.harvests))D.harvests=[];
      D.vegetables.forEach(_normalizeVeg);
      D.days.forEach(_normalizeDay);D.plans.forEach(_normalizePlan);
      _migrateSeedVegs();
      return;
    }catch(e){}
  }
  D={seedVer:SEED_VER,vegetables:VEG_SEED.map(v=>_normalizeVeg(JSON.parse(JSON.stringify(v)))),days:[],plans:[],harvests:[]};
}

// ===================== CLOUD SYNC (Firebase・前回方式を継承) =====================
// 保存先: yasai/y2_{同期キー}
// RTDBルールは yasai/$key のみ読み書き許可のため、その配下を使う。
// キーに y2_ を前置して旧アプリ(yasai/{キー})のデータと衝突しないよう分離する。
function fbPath(){return 'yasai/y2_'+FB_KEY;}
let FB_DB=null,FB_KEY=null,FB_LISTENER=null,FB_ERROR=null,FB_TIMEOUT=null;
let _syncedPhotoIds=new Set(),_pendingPhotoDeletes=new Set(),_saveQueuedForConnect=false,_myRev=null;
const DEFAULT_FB_CONFIG={
  apiKey:"AIzaSyBF5UswvIXO1MKGbpv2vJrmFgsYS0UNSnU",
  authDomain:"vegemane.firebaseapp.com",
  databaseURL:"https://vegemane-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId:"vegemane",
  storageBucket:"vegemane.firebasestorage.app",
  messagingSenderId:"516654510928",
  appId:"1:516654510928:web:5d84fea96669f0be17f255"
};
function updateSyncBadge(st){
  const b=document.getElementById('sync-badge');
  b.className='';
  if(st==='ok'){b.classList.add('ok');b.textContent='☁ 同期中';}
  else if(st==='error'){b.classList.add('error');b.textContent='⚠ エラー';}
  else if(st==='connecting'){b.classList.add('connecting');b.textContent='接続中…';}
  else b.textContent='未同期';
}
function loadCloudConfig(){
  try{
    const raw=localStorage.getItem('yasai2_fb');
    if(!raw){updateSyncBadge('none');return;}
    const saved=JSON.parse(raw);
    if(saved.key){FB_KEY=saved.key;initFirebase(DEFAULT_FB_CONFIG);}
    else updateSyncBadge('none');
  }catch(e){updateSyncBadge('none');}
}
function _loadSDK(cb){
  if(window.firebase&&window.firebase.database){cb();return;}
  const s1=document.createElement('script');
  s1.src='https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js';
  s1.onerror=()=>updateSyncBadge('error');
  s1.onload=()=>{
    const s2=document.createElement('script');
    s2.src='https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js';
    s2.onerror=()=>updateSyncBadge('error');
    s2.onload=cb;
    document.head.appendChild(s2);
  };
  document.head.appendChild(s1);
}
function _collectLocalPhotos(){
  const m={};
  D.days.forEach(dd=>{
    if(dd.fieldPhotos&&dd.fieldPhotos.length)m[dd.id]=dd.fieldPhotos; // 畑全体の写真は日次記録idで保存
    (dd.works||[]).forEach(w=>{if(w.photos&&w.photos.length)m[w.id]=w.photos;});
  });
  return m;
}
function _mergePhotos(photosObj){
  D.days.forEach(dd=>{
    if(photosObj[dd.id])dd.fieldPhotos=photosObj[dd.id];
    (dd.works||[]).forEach(w=>{
      if(photosObj[w.id])w.photos=photosObj[w.id];
    });
  });
}
function initFirebase(config){
  FB_ERROR=null;clearTimeout(FB_TIMEOUT);updateSyncBadge('connecting');
  FB_TIMEOUT=setTimeout(()=>{
    if(!FB_DB){FB_ERROR='タイムアウト：Firebaseに接続できませんでした。';updateSyncBadge('error');render();}
  },15000);
  _loadSDK(()=>{
    const doInit=()=>{
      try{
        window.firebase.initializeApp(config);
        FB_DB=window.firebase.database();
        clearTimeout(FB_TIMEOUT);
        FB_DB.ref(fbPath()).once('value').then(snap=>{
          const d=snap.val();
          if(d&&d.meta&&d.meta.vegetables){
            const remote=d.meta;
            const photosObj=d.photos||{};
            // ローカルにしかない日次記録・予定・収穫を保持
            const merge=(remoteArr,localArr)=>{
              const ids=new Set((remoteArr||[]).map(x=>x.id));
              return [...(remoteArr||[]),...(localArr||[]).filter(x=>!ids.has(x.id))];
            };
            const localDays=D.days,localPhotos=_collectLocalPhotos();
            const hadLocalOnly=(localDays||[]).some(x=>!(remote.days||[]).find(r=>r.id===x.id))
              ||(D.plans||[]).some(x=>!(remote.plans||[]).find(r=>r.id===x.id))
              ||(D.harvests||[]).some(x=>!(remote.harvests||[]).find(r=>r.id===x.id));
            D={
              seedVer:remote.seedVer||1,
              vegetables:remote.vegetables||[],
              days:merge(remote.days,localDays),
              plans:merge(remote.plans,D.plans),
              harvests:merge(remote.harvests,D.harvests)
            };
            D.vegetables.forEach(_normalizeVeg);
            D.days.forEach(_normalizeDay);D.plans.forEach(_normalizePlan);
            const migrated=(D.seedVer||1)<SEED_VER;
            _migrateSeedVegs();
            _mergePhotos(photosObj);
            // Firebase未到達のローカル写真を復元（作物ごと＋畑全体）
            D.days.forEach(dd=>{
              if((!dd.fieldPhotos||!dd.fieldPhotos.length)&&localPhotos[dd.id])dd.fieldPhotos=localPhotos[dd.id];
              (dd.works||[]).forEach(w=>{
                if((!w.photos||!w.photos.length)&&localPhotos[w.id])w.photos=localPhotos[w.id];
              });
            });
            Object.keys(photosObj).forEach(id=>_syncedPhotoIds.add(id));
            _saveLocal();
            if(hadLocalOnly||migrated||_saveQueuedForConnect){_saveQueuedForConnect=false;setTimeout(()=>saveToCloud(),500);}
          }else{
            _saveQueuedForConnect=false;
            saveToCloud();
          }
          FB_ERROR=null;updateSyncBadge('ok');
          _startListener();
          if(S.view!=='entry')render();else renderSidebar();
        }).catch(err=>{
          FB_ERROR='データ読み込みエラー：'+(err.message||err.code||String(err));
          updateSyncBadge('error');
          if(S.view!=='entry')render();
        });
      }catch(e){
        clearTimeout(FB_TIMEOUT);
        FB_ERROR='初期化エラー：'+(e.message||String(e));
        updateSyncBadge('error');render();
      }
    };
    try{
      if(window.firebase.apps&&window.firebase.apps.length){
        Promise.all(window.firebase.apps.map(a=>a.delete())).then(doInit).catch(doInit);
      }else doInit();
    }catch(e){doInit();}
  });
}
function _startListener(){
  if(!FB_DB||!FB_KEY)return;
  if(FB_LISTENER)FB_DB.ref(fbPath()+'/meta').off('value',FB_LISTENER);
  FB_LISTENER=FB_DB.ref(fbPath()+'/meta').on('value',snap=>{
    const meta=snap.val();
    if(!meta||!meta.vegetables)return;
    if(meta.rev&&meta.rev===_myRev)return; // 自分の書き込みは無視
    const photos=_collectLocalPhotos();
    D={
      seedVer:meta.seedVer||1,
      vegetables:meta.vegetables||[],
      days:meta.days||[],
      plans:meta.plans||[],
      harvests:meta.harvests||[]
    };
    D.vegetables.forEach(_normalizeVeg);
    D.days.forEach(_normalizeDay);D.plans.forEach(_normalizePlan);
    _migrateSeedVegs();
    _mergePhotos(photos);
    _saveLocal();
    if(S.view==='entry'){renderSidebar();}else{render();}
  });
}
function saveToCloud(){
  if(!FB_DB||!FB_KEY){
    if(localStorage.getItem('yasai2_fb'))_saveQueuedForConnect=true;
    return;
  }
  _myRev='r'+Date.now()+Math.random().toString(36).slice(2,7);
  const meta=Object.assign({rev:_myRev,updatedAt:new Date().toISOString()},_dataWithoutPhotos());
  FB_DB.ref(fbPath()+'/meta').set(JSON.parse(JSON.stringify(meta)))
    .then(()=>{updateSyncBadge('ok');_syncPhotos();})
    .catch(err=>{FB_ERROR='保存エラー：'+(err.message||String(err));updateSyncBadge('error');});
}
// 写真は1件ずつ順次送信（前回のタイムアウト対策を継承）
function _syncPhotos(){
  if(!FB_DB||!FB_KEY)return;
  const all=_collectLocalPhotos();
  const pending=Object.keys(all).filter(id=>!_syncedPhotoIds.has(id));
  const dels=[..._pendingPhotoDeletes];
  const next=()=>{
    if(dels.length){
      const id=dels.shift();
      _pendingPhotoDeletes.delete(id);
      FB_DB.ref(fbPath()+'/photos/'+id).remove().then(next).catch(next);
      return;
    }
    if(!pending.length)return;
    const id=pending.shift();
    FB_DB.ref(fbPath()+'/photos/'+id).set(all[id])
      .then(()=>{_syncedPhotoIds.add(id);next();})
      .catch(err=>{console.warn('photo sync failed',id,err);next();});
  };
  next();
}

function renderTimeline(main){
  const today=_localDateStr(new Date());
  // 期間
  let from;
  const allDates=[...D.days.map(d=>d.date),...D.plans.map(p=>p.date),...D.harvests.map(h=>h.date)].filter(Boolean).sort();
  if(S.tlDays==='all'&&allDates.length)from=allDates[0];
  else{const d=new Date();d.setDate(d.getDate()-(+S.tlDays||90));from=_localDateStr(d);}
  let to=today;
  const maxPlan=D.plans.map(p=>p.date).sort().pop();
  if(maxPlan&&maxPlan>to)to=maxPlan;
  {const d=new Date(to+'T00:00:00');d.setDate(d.getDate()+7);to=_localDateStr(d);}
  const dates=[];
  for(let d=new Date(from+'T00:00:00');;d.setDate(d.getDate()+1)){
    const ds=_localDateStr(d);dates.push(ds);
    if(ds>=to||dates.length>500)break;
  }
  // 日付→データ索引
  const dayByDate={};D.days.forEach(dd=>{(dayByDate[dd.date]=dayByDate[dd.date]||[]).push(dd);});
  const worksBy={},fieldBy={};
  D.days.forEach(dd=>{
    if((dd.fieldActs&&dd.fieldActs.length)||dd.fieldCustom||(dd.fieldPhotos&&dd.fieldPhotos.length))(fieldBy[dd.date]=fieldBy[dd.date]||[]).push(dd);
    (dd.works||[]).forEach(w=>workVids(w).forEach(vid=>{(worksBy[dd.date+'_'+vid]=worksBy[dd.date+'_'+vid]||[]).push(w);}));
  });
  const plansBy={},planFieldBy={};
  D.plans.forEach(p=>{
    if(p.type==='field'){(planFieldBy[p.date]=planFieldBy[p.date]||[]).push(p);}
    else (p.vids||[]).forEach(vid=>{(plansBy[p.date+'_'+vid]=plansBy[p.date+'_'+vid]||[]).push(p);});
  });
  const harvBy={};D.harvests.forEach(h=>{(harvBy[h.date+'_'+h.vid]=harvBy[h.date+'_'+h.vid]||[]).push(h);});

  let html=`<div id="timeline-wrap">
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap">
      <h2>📅 栽培タイムライン</h2>
      <span style="flex:1"></span>
      <select style="width:auto" onchange="S.tlDays=this.value;render()">
        ${[['90','90日'],['180','180日'],['365','1年'],['all','全期間']].map(([v,l])=>`<option value="${v}" ${S.tlDays===v?'selected':''}>${l}</option>`).join('')}
      </select>
      <button class="btn btn-primary" onclick="newEntry();setView('entry')">✏️ 今日の記録</button>
    </div>
    <div class="tl-scroll"><table class="tl-table"><thead><tr>
      <th class="tl-head-veg">作物＼日付</th>
      ${dates.map(ds=>{
        const d=new Date(ds+'T00:00:00');
        const wd=d.getDay();
        return `<th class="tl-date-head ${ds===today?'today':''} ${wd===0||wd===6?'weekend':''}" onclick="openDayPopup('${ds}',null)">${fmtMD(ds)}<br>${'日月火水木金土'[wd]}</th>`;
      }).join('')}
    </tr></thead><tbody>`;
  // 畑全体行
  html+=`<tr><td class="tl-veg-col">🏞 畑全体</td>${dates.map(ds=>{
    const has=fieldBy[ds],hasPlan=planFieldBy[ds];
    return `<td class="tl-cell ${ds===today?'today':''} ${has||hasPlan?'has-data':''}" onclick="openDayPopup('${ds}',null)">${has?'<span class="tl-dot" style="background:#78350f"></span>':''}${hasPlan?'<span class="tl-dot plan"></span>':''}</td>`;
  }).join('')}</tr>`;
  // 野菜行
  D.vegetables.forEach(v=>{
    html+=`<tr><td class="tl-veg-col"><button class="tl-veg-btn" onclick="selectVeg('${v.id}')">
      ${v.emoji}${esc(v.name)}</button></td>`;
    html+=dates.map(ds=>{
      const ws=worksBy[ds+'_'+v.id]||[];
      const ps=plansBy[ds+'_'+v.id]||[];
      const hs=harvBy[ds+'_'+v.id]||[];
      const dots=[
        ...ws.flatMap(w=>workActs(w)).slice(0,3).map(a=>`<span class="tl-dot" style="background:${actColor(a)}"></span>`),
        ...(hs.length&&!ws.some(w=>workActs(w).some(a=>/収穫/.test(a)))?['<span class="tl-dot" style="background:#dc2626"></span>']:[]),
        ...ps.slice(0,2).map(()=>'<span class="tl-dot plan"></span>')
      ].join('');
      return `<td class="tl-cell ${ds===today?'today':''} ${dots?'has-data':''}" onclick="openDayPopup('${ds}','${v.id}')">${dots}</td>`;
    }).join('');
    html+='</tr>';
  });
  html+=`</tbody></table></div>
  <div style="font-size:11px;color:var(--muted);margin-top:6px">
    ●実施作業（色は作業種別） <span class="tl-dot plan" style="vertical-align:middle"></span>予定作業 ／ セルをクリックで詳細・編集
  </div></div>`;
  main.innerHTML=html;
  // 今日の列が見えるように自動スクロール
  const sc=main.querySelector('.tl-scroll'),th=main.querySelector('.tl-date-head.today');
  if(sc&&th)sc.scrollLeft=Math.max(0,th.offsetLeft-sc.clientWidth+180);
}

  days.forEach(dd=>{
    const works=(dd.works||[]).filter(w=>!vid||workVids(w).includes(vid));
    const env=[dd.weather,dd.wind,dd.temp].filter(Boolean).join(' / ');
    body+=`<div class="popup-entry">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <b>${dd.timeFrom||''}${dd.timeFrom||dd.timeTo?'〜':''}${dd.timeTo||''} ${env?'　'+esc(env):''}</b>

          <button class="btn-sm" onclick="editEntry('${dd.id}')">編集</button>
          <button class="btn-sm" style="background:#dc2626" onclick="deleteDay('${dd.id}')">削除</button>

      ${works.map(w=>{
        const vegs=workVids(w).map(id=>{const v=getVeg(id);return v?v.emoji+esc(v.name):'?';}).join('、');
        const actsHtml=workActs(w).map(a=>`<b style="color:${actColor(a)}">${esc(a)}</b>`).join('・');

          ${vegs||'?'} ${actsHtml}
          ${w.memo?`<span style="color:var(--muted);font-size:11px"> ${esc(w.memo)}</span>`:''}

      }).join('')}
    </div>`;
  });
  if(harvests.length){
    body+=`<div class="popup-entry"><b>🧺 収穫</b>${harvests.map(h=>{
      const v=getVeg(h.vid);
      return `<div style="margin-top:3px">${v?esc(v.name):'?'} ${h.variety?esc(h.variety):''} × ${h.count}個</div>`;

        const vegs=(p.vids||[]).map(id=>{const v=getVeg(id);return v?v.emoji+esc(v.name):'?';}).join('、');

      return `<div style="margin-top:3px"><span class="badge badge-plan">予定</span> ${label}

function renderDetail(main){
  const v=getVeg(S.selVeg)||D.vegetables[0];
  if(!v){main.innerHTML='<div class="card">左の一覧から野菜を選択してください</div>';return;}
  S.selVeg=v.id;
  const tabs=[['info','基本情報'],['sched','スケジュール'],['harvest','収穫数']];
  let html=`<div id="detail-wrap">
    <div class="veg-header">
      <div class="veg-icon" style="background:${v.color}22;border:2px solid ${v.color}">${v.emoji}</div>
      <div style="flex:1">
        <h2>${esc(v.name)}</h2>
        <div class="variety-tags">${(v.varieties||[]).map(x=>`<span class="vtag">${esc(x)}</span>`).join('')||'<span style="font-size:11px;color:var(--muted)">品種未登録</span>'}</div>
      </div>
      <button class="btn btn-outline" onclick="gotoVegForm('${v.id}')">✏️ 編集</button>
    </div>
    <div class="tab-bar">${tabs.map(([k,l])=>`<button class="tab-btn ${S.detailTab===k?'active':''}" onclick="S.detailTab='${k}';render()">${l}</button>`).join('')}</div>`;
  if(S.detailTab==='info')html+=renderInfoTab(v);
  else if(S.detailTab==='sched')html+=renderSchedTab(v);
  else html+=renderHarvestTab(v);
  html+='</div>';
  main.innerHTML=html;
}
function renderInfoTab(v){

  const ff=(label,val)=>`<div class="field-item full"><label>${label}</label><div class="val">${esc(val)||'—'}</div></div>`;
  return `
  <div class="section-card">
    <div class="section-title">🔬 分類・特長</div>
    <div class="field-group">
      ${f('科',x.family)}${f('属',x.genus)}
      ${f('原産地',t.origin)}${f('耐寒・耐暑性',t.coldHeat)}
      ${f('水やり',t.water)}${f('肥料',t.fertilizer)}
      ${ff('その他',t.other)}
    </div>
  </div>
  <div class="section-card">
    <div class="section-title">🌱 栽培管理メモ</div>
    <div class="temp-grid">
      <div class="temp-box"><div class="t-label">発芽適温</div><div class="t-val">${esc(m.germTemp||'—')}</div></div>
      <div class="temp-box"><div class="t-label">生育適温</div><div class="t-val">${esc(m.growTemp||'—')}</div></div>
      <div class="temp-box"><div class="t-label">収穫までに要する日数</div><div class="t-val">${esc(m.harvestDays||'—')}</div></div>
    </div>
    <div class="field-group">
      ${ff('土作・肥料設計',m.soil)}
      ${f('畝立て',m.ridge)}${f('撒種・種まき',m.sow)}
      ${ff('苗定植・植付',m.transplant)}
      ${f('水やり',m.water)}${f('仕立',m.train)}
      ${f('施肥',m.fertilize)}${f('芽かき',m.bud)}
      ${f('葉かき',m.leaf)}${f('散布',m.spray)}
      ${f('摘花・果',m.flowerFruit)}${f('収穫',m.harvest)}
      ${f('保存方法',m.storage)}${f('収穫数目安',m.expected)}
      ${ff('備考',m.note)}
    </div>
  </div>`;
}
function renderSchedTab(v){
  // 実施（日次記録から抽出）＋予定＋収穫
  const items=[];
  D.days.forEach(dd=>(dd.works||[]).forEach(w=>{
    if(workVids(w).includes(v.id))items.push({type:'work',date:dd.date,day:dd,w});
  }));
  D.plans.forEach(p=>{if(p.type!=='field'&&(p.vids||[]).includes(v.id))items.push({type:'plan',date:p.date,p});});
  D.harvests.forEach(h=>{if(h.vid===v.id)items.push({type:'harvest',date:h.date,h});});
  items.sort((a,b)=>b.date.localeCompare(a.date));
  if(!items.length)return `<div class="section-card" style="color:var(--muted)">記録はまだありません</div>`;
  return items.map(it=>{
    if(it.type==='work'){
      const dd=it.day,w=it.w;
      const env=[dd.weather,dd.wind,dd.temp].filter(Boolean).join(' / ');
      return `<div class="sched-item">
        <div class="left"><div class="date">${fmtMD(it.date)}</div><div class="time">${dd.timeFrom||''}${dd.timeFrom||dd.timeTo?'〜':''}${dd.timeTo||''}</div></div>
        <div class="right">
          <div class="act">${workActs(w).map(a=>`<span style="color:${actColor(a)}">${esc(a)}</span>`).join('・')} <span class="badge badge-actual">実施</span></div>
          ${env?`<div class="memo">🌤 ${esc(env)}</div>`:''}
          ${w.memo?`<div class="memo">${esc(w.memo)}</div>`:''}
          ${w.photos&&w.photos.length?`<div class="photo-thumbs">${w.photos.map((p,i)=>`<img class="photo-thumb" src="${p}" onclick="openLightbox('${w.id}',${i})">`).join('')}</div>`:''}
        </div>
      </div>`;
    }
    if(it.type==='plan'){
      const p=it.p;
      return `<div class="sched-item" style="background:#f8fafc">
        <div class="left"><div class="date">${fmtMD(it.date)}</div></div>
        <div class="right"><div class="act" style="color:#1d4ed8">${esc(planActs(p).join('・'))} <span class="badge badge-plan">予定</span></div></div>
      </div>`;
    }
    const h=it.h;
    return `<div class="sched-item" style="background:#fff7f7">
      <div class="left"><div class="date">${fmtMD(it.date)}</div></div>
      <div class="right"><div class="act" style="color:#dc2626">収穫 <span class="badge badge-harvest">${esc(h.variety||'')} × ${h.count}個</span></div></div>
    </div>`;
  }).join('');
}
function renderHarvestTab(v){
  const hs=D.harvests.filter(h=>h.vid===v.id).sort((a,b)=>b.date.localeCompare(a.date));
  if(!hs.length)return `<div class="section-card" style="color:var(--muted)">収穫記録はまだありません</div>`;
  // 品種別集計
  const byVar={};let total=0;
  hs.forEach(h=>{const k=h.variety||'(品種未指定)';byVar[k]=(byVar[k]||0)+(+h.count||0);total+=(+h.count||0);});
  let html=`<div class="section-card">
    <div class="section-title">🧺 品種別収穫合計</div>
    <table class="harvest-table">
      <tr><th>品種</th><th style="text-align:right">合計</th></tr>
      ${Object.entries(byVar).map(([k,n])=>`<tr><td>${esc(k)}</td><td style="text-align:right">${n}個</td></tr>`).join('')}
      <tr class="harvest-total"><td>総計</td><td style="text-align:right">${total}個</td></tr>
    </table>
  </div>
  <div class="section-card">
    <div class="section-title">収穫履歴</div>
    <table class="harvest-table">
      <tr><th>日付</th><th>品種</th><th style="text-align:right">個数</th></tr>
      ${hs.map(h=>`<tr><td>${h.date}</td><td>${esc(h.variety||'—')}</td><td style="text-align:right">${h.count}</td></tr>`).join('')}
    </table>
  </div>`;
  return html;
}

// ---------- 統一入力フォーム ----------
function _emptyWorkRow(){return {id:newId('w'),vids:[],acts:[],custom:'',memo:'',photos:[]};}
function newEntry(){newEntryFor(_localDateStr(new Date()));}
function newEntryFor(ds){
  E={id:null,date:ds,timeFrom:'',timeTo:'',weather:'',wind:'',temp:'',
     fieldActs:[],fieldCustom:'',fieldPhotos:[],
     works:[_emptyWorkRow()],
     planFields:[],planWorks:[],harvests:[]};
}
function editEntry(dayId){
  const dd=D.days.find(x=>x.id===dayId);
  if(!dd)return;
  closePopup();
  E={id:dd.id,date:dd.date,timeFrom:dd.timeFrom||'',timeTo:dd.timeTo||'',
     weather:dd.weather||'',wind:dd.wind||'',temp:dd.temp||'',
     fieldActs:[...(dd.fieldActs||[])],fieldCustom:dd.fieldCustom||'',fieldPhotos:[...(dd.fieldPhotos||[])],
     works:(dd.works||[]).map(w=>({id:w.id,vids:[...workVids(w)],acts:[...(w.acts||[])],custom:w.custom||'',memo:w.memo||'',photos:[...(w.photos||[])]})),
     planFields:D.plans.filter(p=>p.src===dd.id&&p.type==='field').map(p=>({date:p.date,fieldActs:[...(p.fieldActs||[])],fieldCustom:p.fieldCustom||''})),
     planWorks:D.plans.filter(p=>p.src===dd.id&&p.type!=='field').map(p=>({date:p.date,vids:[...(p.vids||[])],acts:[...(p.acts||[])],custom:p.custom||''})),
     harvests:D.harvests.filter(h=>h.src===dd.id).map(h=>({vid:h.vid,variety:h.variety||'',count:h.count}))};
  if(!E.works.length)E.works.push(_emptyWorkRow());
  setView('entry');
}
function deleteDay(dayId){
  const dd=D.days.find(x=>x.id===dayId);
  if(!dd)return;
  if(!confirm(dd.date+' の記録を削除しますか？（この日の予定・収穫記録も削除されます）'))return;
  if(dd.fieldPhotos&&dd.fieldPhotos.length){_pendingPhotoDeletes.add(dd.id);_syncedPhotoIds.delete(dd.id);}
  (dd.works||[]).forEach(w=>{if(w.photos&&w.photos.length){_pendingPhotoDeletes.add(w.id);_syncedPhotoIds.delete(w.id);}});
  D.days=D.days.filter(x=>x.id!==dayId);
  D.plans=D.plans.filter(p=>p.src!==dayId);
  D.harvests=D.harvests.filter(h=>h.src!==dayId);
  saveData();closePopup();render();toast('削除しました');
}
function deletePlan(pid){
  D.plans=D.plans.filter(p=>p.id!==pid);
  saveData();closePopup();render();toast('予定を削除しました');
}
function vegOptions(sel){
  return '<option value="">作物を選択</option>'+D.vegetables.map(v=>`<option value="${v.id}" ${sel===v.id?'selected':''}>${v.emoji}${esc(v.name)}</option>`).join('');
}
function varietyOptions(vid,sel){
  const v=getVeg(vid);

}

function workRowHtml(w,i){

    </div>
    <div class="act-check-grid chip-mini">
      ${D.vegetables.map(v=>`<label class="act-check-label ${w.vids.includes(v.id)?'checked':''}">
        <input type="checkbox" ${w.vids.includes(v.id)?'checked':''} onchange="toggleWorkVid(${i},'${v.id}',this.checked)">${v.emoji}${esc(v.name)}</label>`).join('')}
    </div>
    <label>【２】　作業（複数選択可）</label>
    <div class="act-check-grid chip-mini">
      ${OPT_C.map(a=>`<label class="act-check-label ${w.acts.includes(a)?'checked':''}">
        <input type="checkbox" ${w.acts.includes(a)?'checked':''} onchange="toggleWorkAct(${i},'${a}',this.checked)">${a}</label>`).join('')}
    </div>
    ${w.acts.includes('自由入力')?`<input style="margin-top:6px" placeholder="作業内容を入力" value="${esc(w.custom)}" onchange="E.works[${i}].custom=this.value">`:''}
    <input style="margin-top:6px" placeholder="メモ（任意）" value="${esc(w.memo)}" onchange="E.works[${i}].memo=this.value">
    <div class="photo-thumbs">
      ${(w.photos||[]).map((p,pi)=>`<div class="photo-item"><img src="${p}"><button class="photo-del" onclick="removeWorkPhoto(${i},${pi})">✕</button></div>`).join('')}
    </div>
    <button class="photo-add-btn" onclick="pickWorkPhoto(${i})" ${(w.photos||[]).length>=4?'disabled':''}>📷 写真を追加（${(w.photos||[]).length}/4）</button>
  </div>`;
}
function toggleWorkVid(i,vid,on){
  const a=E.works[i].vids;
  if(on){if(!a.includes(vid))a.push(vid);}
  else E.works[i].vids=a.filter(x=>x!==vid);
  renderEntryKeep();
}
function toggleWorkAct(i,act,on){
  const a=E.works[i].acts;
  if(on){if(!a.includes(act))a.push(act);}
  else E.works[i].acts=a.filter(x=>x!==act);
  renderEntryKeep();
}
function pickFieldPhoto(){
  const inp=document.createElement('input');
  inp.type='file';inp.accept='image/*';inp.multiple=true;
  inp.onchange=()=>{
    const files=[...inp.files].slice(0,4-(E.fieldPhotos||[]).length);
    let remain=files.length;
    if(!remain)return;
    toast('写真を圧縮中…');
    files.forEach(f=>_compressImage(f,b64=>{
      if(b64)E.fieldPhotos.push(b64);
      if(--remain===0)renderEntryKeep();
    }));
  };
  inp.click();
}
function removeFieldPhoto(pi){E.fieldPhotos.splice(pi,1);renderEntryKeep();}

function addPlanFieldRow(){E.planFields.push({date:E.date,fieldActs:[],fieldCustom:''});renderEntryKeep();}
function addPlanWorkRow(){E.planWorks.push({date:E.date,vids:[],acts:[],custom:''});renderEntryKeep();}
function harvestRowHtml(h,i){
  const v=getVeg(h.vid);
  const inList=v&&(v.varieties||[]).includes(h.variety);
  const selVal=h.variety&&!inList?'__free__':h.variety;
  return `<div class="work-row"><div class="work-row-head">
    <div class="fi"><label>作物名</label><select onchange="E.harvests[${i}].vid=this.value;E.harvests[${i}].variety='';renderEntryKeep()">${vegOptions(h.vid)}</select></div>
    <div class="fi"><label>品種</label><select onchange="E.harvests[${i}].variety=this.value;renderEntryKeep()">${varietyOptions(h.vid,selVal)}</select></div>
    <div class="fi" style="max-width:90px"><label>個数</label><input type="number" min="0" value="${h.count!=null?h.count:''}" onchange="E.harvests[${i}].count=this.value"></div>
    <button class="row-del" onclick="E.harvests.splice(${i},1);renderEntryKeep()">🗑</button>
  </div>
  ${selVal==='__free__'?`<input style="margin-top:6px" placeholder="品種名を入力" value="${esc(h.varietyFree||'')}" onchange="E.harvests[${i}].varietyFree=this.value">`:''}
  </div>`;
}
function renderEntryKeep(){
  const main=document.getElementById('main');
  const st=main.scrollTop;
  renderEntry(main);
  main.scrollTop=st;
}
function toggleFieldAct(a,on){
  if(on){if(!E.fieldActs.includes(a))E.fieldActs.push(a);}
  else E.fieldActs=E.fieldActs.filter(x=>x!==a);
  renderEntryKeep();
}
function addWorkRow(){
  if(E.works.length>=30)return;
  E.works.push(_emptyWorkRow());
  renderEntryKeep();
}
function removeWorkRow(i){
  const w=E.works[i];
  if(w&&(w.photos||[]).length&&!confirm('写真付きの行です。削除しますか？'))return;
  E.works.splice(i,1);
  if(!E.works.length)E.works.push(_emptyWorkRow());
  renderEntryKeep();
}
function removeWorkPhoto(i,pi){E.works[i].photos.splice(pi,1);renderEntryKeep();}
function pickWorkPhoto(i){
  const inp=document.createElement('input');
  inp.type='file';inp.accept='image/*';inp.multiple=true;
  inp.onchange=()=>{
    const files=[...inp.files].slice(0,4-(E.works[i].photos||[]).length);
    let remain=files.length;
    if(!remain)return;
    toast('写真を圧縮中…');
    files.forEach(f=>_compressImage(f,b64=>{
      if(b64)E.works[i].photos.push(b64);
      if(--remain===0)renderEntryKeep();
    }));
  };
  inp.click();
}
function addHarvestRow(){E.harvests.push({vid:'',variety:'',varietyFree:'',count:''});renderEntryKeep();}
async function fetchWeatherBtn(){
  const btn=document.getElementById('wx-fetch');
  btn.disabled=true;btn.textContent='取得中…';
  try{
    const r=await fetchWeatherFor(E.date,E.timeFrom,E.timeTo);
    E.weather=r.weather;E.wind=r.wind;E.temp=r.temp;
    document.getElementById('e-weather').value=r.weather;
    document.getElementById('e-wind').value=r.wind;
    document.getElementById('e-temp').value=r.temp;
    toast(`取得しました: ${r.weather} / ${r.wind} / ${r.temp}`);
  }catch(err){
    toast('天気を取得できませんでした: '+(err.message||err));
  }
  btn.disabled=false;btn.textContent='🌤 天気を自動取得';
}
function saveEntry(){
  if(!E.date){toast('日付を入力してください');return;}
  const works=E.works.filter(w=>w.vids.length&&(w.acts.length||(w.custom||'').trim()||(w.photos||[]).length));
  const planFields=E.planFields.filter(p=>p.date&&(p.fieldActs.length||(p.fieldCustom||'').trim()));
  const planWorks=E.planWorks.filter(p=>p.date&&p.vids.length&&(p.acts.length||(p.custom||'').trim()));
  const harvests=E.harvests.filter(h=>h.vid&&(+h.count>0));
  const hasField=E.fieldActs.length||E.fieldCustom.trim()||(E.fieldPhotos||[]).length;
  const hasEnv=E.weather||E.wind||E.temp||E.timeFrom||E.timeTo;
  if(!works.length&&!planFields.length&&!planWorks.length&&!harvests.length&&!hasField&&!hasEnv){toast('入力内容がありません');return;}
  let dayId=E.id;
  const dayObj={
    id:dayId||newId('d'),date:E.date,timeFrom:E.timeFrom,timeTo:E.timeTo,
    weather:E.weather,wind:E.wind,temp:E.temp,
    fieldActs:[...E.fieldActs],fieldCustom:E.fieldCustom.trim(),fieldPhotos:[...(E.fieldPhotos||[])],
    works:works.map(w=>({id:w.id,vids:[...w.vids],acts:[...w.acts],custom:(w.custom||'').trim(),memo:(w.memo||'').trim(),photos:w.photos||[]}))
  };
  dayId=dayObj.id;
  if(E.id){
    const idx=D.days.findIndex(x=>x.id===E.id);
    // 写真が無くなった行(行削除・写真全削除)はクラウドの写真も削除
    if(idx>=0){
      const old=D.days[idx];
      const oldIds=new Set((old.works||[]).filter(w=>(w.photos||[]).length).map(w=>w.id));
      if((old.fieldPhotos||[]).length)oldIds.add(old.id);
      const newIds=new Set(dayObj.works.filter(w=>(w.photos||[]).length).map(w=>w.id));
      if((dayObj.fieldPhotos||[]).length)newIds.add(dayObj.id);
      oldIds.forEach(id=>{if(!newIds.has(id)){_pendingPhotoDeletes.add(id);_syncedPhotoIds.delete(id);}});
      D.days[idx]=dayObj;
    }else D.days.push(dayObj);
    D.plans=D.plans.filter(p=>p.src!==E.id);
    D.harvests=D.harvests.filter(h=>h.src!==E.id);
  }else{
    D.days.push(dayObj);
  }
  // 写真が変わった行は再送信対象にする（畑全体の写真も含む）
  dayObj.works.forEach(w=>{_syncedPhotoIds.delete(w.id);if(!(w.photos||[]).length)_syncedPhotoIds.add(w.id);});
  _syncedPhotoIds.delete(dayObj.id);
  if(!(dayObj.fieldPhotos||[]).length)_syncedPhotoIds.add(dayObj.id);
  planFields.forEach(p=>D.plans.push({id:newId('p'),src:dayId,type:'field',date:p.date,fieldActs:[...p.fieldActs],fieldCustom:(p.fieldCustom||'').trim(),custom:''}));
  planWorks.forEach(p=>D.plans.push({id:newId('p'),src:dayId,type:'work',date:p.date,vids:[...p.vids],acts:[...p.acts],custom:(p.custom||'').trim()}));
  harvests.forEach(h=>{
    const variety=h.variety==='__free__'?(h.varietyFree||'').trim():h.variety;
    D.harvests.push({id:newId('h'),src:dayId,date:E.date,vid:h.vid,variety,count:+h.count});
  });
  D.days.sort((a,b)=>a.date.localeCompare(b.date));
  saveData();
  E=null;
  S.view='timeline';
  render();
  toast('保存しました');
}

// ---------- 野菜 追加/編集フォーム ----------
function gotoVegForm(id){S.editVegId=id;S.view='veg-form';render();}

  const v=S.editVegId?getVeg(S.editVegId):null;
  const m=(v&&v.mgmt)||{},t=(v&&v.traits)||{},x=(v&&v.tax)||{};
  main.innerHTML=`<div id="form-wrap"><div class="card">
    <h2>${v?'🥬 野菜の編集':'🥬 野菜の追加'}</h2>
    <div class="form-row-2">
      <div><label>名前 *</label><input id="vf-name" value="${v?esc(v.name):''}"></div>
      <div><label>絵文字</label><input id="vf-emoji" value="${v?esc(v.emoji):'🌱'}"></div>
    </div>
    <div class="form-row-2">
      <div><label>色（作業の点の色など）</label><input type="color" id="vf-color" value="${v?v.color:'#3d7a3d'}" style="height:34px;padding:2px"></div>
      <div><label>品種（「、」区切りで複数）</label><input id="vf-varieties" value="${v?esc((v.varieties||[]).join('、')):''}" placeholder="例: 白露"></div>
    </div>
    <h3 style="margin-top:14px;border-bottom:1px solid var(--border);padding-bottom:4px">🔬 分類・特長</h3>
    <div class="form-row-2">
      <div><label>科</label><input id="vf-family" value="${esc(x.family||'')}" placeholder="例: アブラナ科"></div>
      <div><label>属</label><input id="vf-genus" value="${esc(x.genus||'')}" placeholder="例: アブラナ属"></div>
    </div>
    ${TRAIT_FIELDS.map(([k,l])=>`<label>${l}</label><textarea id="vf-t-${k}" rows="2">${esc(t[k]||'')}</textarea>`).join('')}
    <h3 style="margin-top:14px;border-bottom:1px solid var(--border);padding-bottom:4px">🌱 栽培管理メモ</h3>
    <div class="form-row-3">
      <div><label>発芽適温</label><input id="vf-germTemp" value="${esc(m.germTemp||'')}" placeholder="例: 15-20℃"></div>
      <div><label>生育適温</label><input id="vf-growTemp" value="${esc(m.growTemp||'')}" placeholder="例: 15-20℃"></div>
      <div><label>収穫までに要する日数</label><input id="vf-harvestDays" value="${esc(m.harvestDays||'')}" placeholder="例: 定植後60-70日 / 種まき後80-90日"></div>
    </div>
    ${MGMT_FIELDS.slice(3).map(([k,l])=>`<label>${l}</label><textarea id="vf-${k}" rows="2">${esc(m[k]||'')}</textarea>`).join('')}
    <div class="form-actions">
      <button class="btn btn-primary" style="flex:1" onclick="saveVeg()">💾 保存</button>
      ${v?`<button class="btn btn-danger" onclick="deleteVeg('${v.id}')">削除</button>`:''}
      <button class="btn btn-outline" onclick="S.view=S.editVegId?'detail':'timeline';render()">戻る</button>
    </div>
  </div></div>`;
}
function saveVeg(){
  const name=document.getElementById('vf-name').value.trim();
  if(!name){toast('名前を入力してください');return;}
  const data={
    name,emoji:document.getElementById('vf-emoji').value.trim()||'🌱',
    color:document.getElementById('vf-color').value,
    varieties:document.getElementById('vf-varieties').value.split(/[、,]/).map(s=>s.trim()).filter(Boolean),
    tax:{family:document.getElementById('vf-family').value.trim(),genus:document.getElementById('vf-genus').value.trim()},
    traits:{},
    mgmt:{}
  };
  TRAIT_FIELDS.forEach(([k])=>{data.traits[k]=(document.getElementById('vf-t-'+k)||{value:''}).value.trim();});
  MGMT_FIELDS.forEach(([k])=>{data.mgmt[k]=(document.getElementById('vf-'+k)||{value:''}).value.trim();});
  if(S.editVegId){
    const v=getVeg(S.editVegId);
    Object.assign(v,data);
    S.selVeg=v.id;
  }else{
    const v=_normalizeVeg(Object.assign({id:newId('v')},data));
    D.vegetables.push(v);
    S.selVeg=v.id;
  }
  saveData();
  S.view='detail';render();toast('保存しました');
}
function deleteVeg(id){
  const v=getVeg(id);
  const used=D.days.some(dd=>(dd.works||[]).some(w=>workVids(w).includes(id)))||D.harvests.some(h=>h.vid===id);
  if(!confirm(`「${v.name}」を削除しますか？${used?'\n※この野菜の作業・収穫記録が一覧に表示されなくなります':''}`))return;
  D.vegetables=D.vegetables.filter(x=>x.id!==id);
  if(S.selVeg===id)S.selVeg=null;
  saveData();S.view='timeline';render();toast('削除しました');
}

// ---------- 設定 ----------
function renderSettings(main){
  const saved=localStorage.getItem('yasai2_fb');
  let key='';
  try{key=saved?(JSON.parse(saved).key||''):'';}catch(e){}
  const loc=getLoc();
  main.innerHTML=`<div id="settings-wrap">
    <div class="card">
      <h2>☁ クラウド同期（Firebase）</h2>
      <p style="font-size:12px;color:var(--muted);margin:6px 0">
        前回アプリと同じFirebaseプロジェクト(vegemane)の新しい保存領域(yasai2)を使います。<br>
        同じ「同期キー」を入れた端末同士でデータ・写真が同期されます。
      </p>
      <label>同期キー（好きな英数字。例: nomura-yasai-2026）</label>
      <input id="fb-key" value="${esc(key)}" placeholder="同期キーを入力">
      <div class="form-actions">
        <button class="btn btn-primary" onclick="connectCloud()">接続する</button>
        ${key?'<button class="btn btn-danger" onclick="disconnectCloud()">同期を解除</button>':''}
      </div>
      ${FB_ERROR?`<div style="color:#dc2626;font-size:12px;margin-top:8px;white-space:pre-wrap">${esc(FB_ERROR)}</div>`:''}
    </div>
    <div class="card">
      <h2>📍 天気取得の場所</h2>
      <label>場所の名前</label><input id="loc-name" value="${esc(loc.name)}">
      <div class="form-row-2">
        <div><label>緯度</label><input id="loc-lat" type="number" step="0.001" value="${loc.lat}"></div>
        <div><label>経度</label><input id="loc-lon" type="number" step="0.001" value="${loc.lon}"></div>
      </div>
      <div class="form-actions">
        <button class="btn btn-primary" onclick="saveLoc()">保存</button>
        <button class="btn btn-outline" onclick="localStorage.removeItem('yasai2_loc');render();toast('初期値(印西市戸神)に戻しました')">初期値に戻す</button>
      </div>
    </div>
    <div class="card">
      <h2>💾 バックアップ</h2>
      <div class="form-actions" style="border:none;margin-top:4px;padding-top:0">
        <button class="btn btn-outline" onclick="exportData()">⬇ JSONエクスポート</button>
        <button class="btn btn-outline" onclick="importData()">⬆ JSONインポート</button>
      </div>
    </div>
  </div>`;
}
function connectCloud(){
  const key=document.getElementById('fb-key').value.trim();
  if(!key){toast('同期キーを入力してください');return;}
  localStorage.setItem('yasai2_fb',JSON.stringify({key}));
  FB_KEY=key;
  initFirebase(DEFAULT_FB_CONFIG);
  toast('接続しています…');
}
function disconnectCloud(){
  if(!confirm('クラウド同期を解除しますか？（クラウド上のデータは残ります）'))return;
  localStorage.removeItem('yasai2_fb');
  if(FB_DB&&FB_LISTENER){try{FB_DB.ref(fbPath()+'/meta').off('value',FB_LISTENER);}catch(e){}}
  FB_DB=null;FB_KEY=null;FB_LISTENER=null;
  _saveLocal();
  updateSyncBadge('none');render();toast('解除しました');
}
function saveLoc(){
  const name=document.getElementById('loc-name').value.trim()||DEFAULT_LOC.name;
  const lat=parseFloat(document.getElementById('loc-lat').value),lon=parseFloat(document.getElementById('loc-lon').value);
  if(isNaN(lat)||isNaN(lon)){toast('緯度・経度を数値で入力してください');return;}
  localStorage.setItem('yasai2_loc',JSON.stringify({name,lat,lon}));
  toast('保存しました');
}
function exportData(){
  const blob=new Blob([JSON.stringify(D,null,1)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='yasai2_data_'+_localDateStr(new Date())+'.json';
  a.click();
  URL.revokeObjectURL(a.href);
}
function importData(){
  const inp=document.createElement('input');
  inp.type='file';inp.accept='.json';
  inp.onchange=()=>{
    const f=inp.files[0];if(!f)return;
    const reader=new FileReader();
    reader.onload=ev=>{
      try{
        const d=JSON.parse(ev.target.result);
        if(!d.vegetables)throw new Error('形式が違います');
        if(!confirm('現在のデータを読み込んだデータで置き換えますか？'))return;
        D=d;
        D.vegetables.forEach(_normalizeVeg);
        (D.days||[]).forEach(_normalizeDay);
        (D.plans||[]).forEach(_normalizePlan);
        _syncedPhotoIds=new Set();
        saveData();render();toast('インポートしました');
      }catch(e){toast('読み込み失敗: '+e.message);}
    };
    reader.readAsText(f);
  };
  inp.click();
}

document.querySelectorAll('.nav-tab').forEach(t=>t.addEventListener('click',()=>setView(t.dataset.v)));
document.getElementById('toggle-sb').addEventListener('click',()=>document.getElementById('sidebar').classList.toggle('collapsed'));
loadData();
loadCloudConfig();
if(window.innerWidth<700)document.getElementById('sidebar').classList.add('collapsed');
render();
</script>
